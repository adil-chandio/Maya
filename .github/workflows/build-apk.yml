name: Build MAYA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: bun install

    - name: Build web app
      run: bun run build

    - name: Sync Capacitor
      run: bunx cap sync android

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Show Android config
      run: |
        echo "=== compileSdk ==="
        grep compileSdk android/variables.gradle
        echo "=== AGP version ==="
        grep gradle android/build.gradle
        echo "=== Gradle version ==="
        grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
        echo "=== Java version ==="
        java -version
        echo "=== Android SDK ==="
        echo $ANDROID_HOME

    - name: Build APK
      run: cd android && ./gradlew assembleDebug --no-daemon 2>&1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MAYA-APK
        path: android/**/*.apk
        if-no-files-found: warn
        retention-days: 30
