name: Build MAYA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: bun install

    - name: Build web app
      run: bun run build

    - name: Sync Capacitor
      run: bunx cap sync android

    - name: Verify web assets in Android
      run: ls -la android/app/src/main/assets/public/

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build APK (with verbose output)
      run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

    - name: Check build outputs
      run: find android/app/build -name "*.apk" -type f 2>/dev/null || echo "No APK found in build outputs"

    - name: List build directory structure
      run: find android/app/build -type f -name "*.apk" 2>/dev/null; ls -la android/app/build/outputs/ 2>/dev/null || echo "No outputs directory"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: MAYA-APK
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/**/*.apk
        if-no-files-found: warn
        retention-days: 30
